<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="light">

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" type="button" aria-label="Toggle dark/light theme">
      🌙 Dark Mode
    </button>
  </header>

  <main>

    <!-- Left Column -->
    <div class="column column--left">

      <!-- Balance Section -->
      <section id="balance-section" aria-labelledby="balance-heading">
        <h2 id="balance-heading">Total Balance</h2>
        <p class="balance-amount">
          <span id="balance-display">0.00</span>
        </p>
      </section>

      <!-- Transaction Input Form Section -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              placeholder="e.g. Lunch at warung"
              autocomplete="off"
            />
            <span class="error-msg" id="item-name-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="item-amount">Amount</label>
            <input
              type="number"
              id="item-amount"
              name="item-amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
            />
            <span class="error-msg" id="item-amount-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category-select">Category</label>
            <select id="category-select" name="category-select">
              <option value="">-- Select a category --</option>
            </select>
            <span class="error-msg" id="category-select-error" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn--primary">Add Transaction</button>

        </form>
      </section>

      <!-- Category Manager Section -->
      <section id="category-section" aria-labelledby="category-heading">
        <h2 id="category-heading">Manage Categories</h2>
        <div class="category-manager">
          <div class="form-group">
            <label for="new-category-input">New Category</label>
            <input
              type="text"
              id="new-category-input"
              name="new-category-input"
              maxlength="50"
              placeholder="e.g. Healthcare"
              autocomplete="off"
            />
            <span class="error-msg" id="new-category-error" role="alert" aria-live="polite"></span>
          </div>
          <button type="button" id="add-category-btn" class="btn btn--secondary">
            Add Category
          </button>
        </div>
      </section>

      <!-- Monthly Filter Section -->
      <section id="filter-section" aria-labelledby="filter-heading">
        <h2 id="filter-heading">Filter by Month</h2>
        <div class="filter-controls">
          <div class="form-group">
            <label for="month-filter">Select Month</label>
            <input
              type="month"
              id="month-filter"
              name="month-filter"
            />
          </div>
          <button type="button" id="clear-filter-btn" class="btn btn--ghost">
            Clear Filter
          </button>
        </div>
      </section>

    </div>
    <!-- /Left Column -->

    <!-- Right Column -->
    <div class="column column--right">

      <!-- Chart Section -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spending-chart" role="img" aria-label="Spending distribution pie chart"></canvas>
          <p id="chart-placeholder" class="empty-state" aria-live="polite">
            No spending data available. Add a transaction to see the chart.
          </p>
        </div>
      </section>

      <!-- Transaction List Section -->
      <section id="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-live="polite" aria-label="Transaction list">
          <!-- Transaction items rendered by app.js -->
        </ul>
      </section>

    </div>
    <!-- /Right Column -->

  </main>

  <!-- Toast Notifications -->
  <div id="toast-container" role="region" aria-label="Notifications" aria-live="assertive"></div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Application Logic -->
  <script src="js/app.js" defer></script>

</body>
</html>
